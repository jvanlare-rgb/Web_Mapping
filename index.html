<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>WA COVID-19 Death Rate (per 10k people)</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>
  <style>
    h2, h3 {
      margin: 10px;
      font-size: 18px;
    }

    h3 {
      font-size: 16px;
    }

    p {
      margin: 10px;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
    }

    .map-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      background: rgba(255, 255, 255, 0.8);
      border-style: solid;
      border-width: 1px;
      border-color: rgba(0, 0, 0, 0.2);
      margin-left: 20px;
      font-family: Arial, sans-serif;
      overflow: auto;
      border-radius: 3px;
    }

    #features {
      top: 0;
      height: 100px;
      margin-top: 20px;
      width: 250px;
    }

    #legend {
      padding: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      line-height: 18px;
      height: 170px;
      margin-bottom: 40px;
      width: 160px;
    }

    .legend-key {
      display: inline-block;
      border-radius: 20%;
      width: 10px;
      height: 10px;
      margin-right: 5px;
    }

    .mapboxgl-canvas-container.mapboxgl-interactive,
    .mapboxgl-ctrl-group button.mapboxgl-ctrl-compass {
      cursor: unset;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class='map-overlay' id='features'>
    <h2>WA COVID-19 Death Rate</h2>
    <div id='text-description'>
      <p>Hover over a county!</p>
    </div>
  </div>
  <div class='map-overlay' id='legend'></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoianZhbmxhcmUiLCJhIjoiY21oY2Zrd29nMTN2dDJtcHh5YzlxYWVtNSJ9.bP5BGQT-tdmmsC1SStqvNw';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v10',
      center: [-120.5, 47.4], // Washington State
      zoom: 6.2
    });

    async function geojsonFetch() {
      let response = await fetch('assets/wa_covid_data-102521.geojson');
      let covidData = await response.json();

      map.addSource('covidData', {
        type: 'geojson',
        data: covidData
      });

      map.addLayer({
        id: 'covidData-layer',
        type: 'fill',
        source: 'covidData',
        paint: {
          'fill-color': [
            'step',
            ['get', 'deathPer10k'],
            '#f2f0f7', 2,
            '#cbc9e2', 4,
            '#9e9ac8', 6,
            '#756bb1', 8,
            '#54278f'
          ],
          'fill-outline-color': '#BBBBBB',
          'fill-opacity': 0.75
        }
      });

      // Legend
      const layers = [
        '0–2', '2–4', '4–6', '6–8', '8+'
      ];
      const colors = [
        '#f2f0f7',
        '#cbc9e2',
        '#9e9ac8',
        '#756bb1',
        '#54278f'
      ];
      const legend = document.getElementById('legend');
      legend.innerHTML = "<b>Death Rate<br>(per 10k people)</b><br><br>";

      layers.forEach((layer, i) => {
        const color = colors[i];
        const item = document.createElement('div');
        const key = document.createElement('span');
        key.className = 'legend-key';
        key.style.backgroundColor = color;
        const value = document.createElement('span');
        value.innerHTML = `${layer}`;
        item.appendChild(key);
        item.appendChild(value);
        legend.appendChild(item);
      });
    }

    map.on('load', geojsonFetch);

    // Hover popup
    map.on('mousemove', ({ point }) => {
      const county = map.queryRenderedFeatures(point, {
        layers: ['covidData-layer']
      });

      document.getElementById('text-description').innerHTML = county.length
        ? `<h3>${county[0].properties.name}</h3>
           <p><strong><em>${county[0].properties.deathPer10k}</strong> deaths per 10k people</em></p>`
        : `<p>Hover over a county!</p>`;
    });
  </script>
</body>

</html>
