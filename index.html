<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>WA COVID-19 Death Rate (per 10k people)</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .map-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 5px;
      padding: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      max-width: 220px;
    }

    .legend-key {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 5px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class="map-overlay" id="legend">
    <h3>COVID-19 Death Rate<br>(per 10k people)</h3>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoianZhbmxhcmUiLCJhIjoiY21oY2Zrd29nMTN2dDJtcHh5YzlxYWVtNSJ9.bP5BGQT-tdmmsC1SStqvNw';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v10',
      center: [-120.5, 47.4],
      zoom: 6.2
    });

    async function geojsonFetch() {
      const response = await fetch('assets/wa_covid_data-102521.geojson');
      const data = await response.json();

      map.on('load', () => {
        map.addSource('wa-covid', {
          type: 'geojson',
          data: data
        });

        map.addLayer({
          id: 'death-rate',
          type: 'fill',
          source: 'wa-covid',
          paint: {
            'fill-color': [
              'interpolate',
              ['linear'],
              ['get', 'deathPer10k'],
              0, '#f2f0f7',
              2, '#cbc9e2',
              4, '#9e9ac8',
              6, '#756bb1',
              8, '#54278f'
            ],
            'fill-opacity': 0.75,
            'fill-outline-color': '#ffffff'
          }
        });

        map.addLayer({
          id: 'county-borders',
          type: 'line',
          source: 'wa-covid',
          paint: {
            'line-color': '#fff',
            'line-width': 1
          }
        });

        const layers = ['0–2', '2–4', '4–6', '6–8', '8+'];
        const colors = ['#f2f0f7', '#cbc9e2', '#9e9ac8', '#756bb1', '#54278f'];

        const legend = document.getElementById('legend');
        layers.forEach((layer, i) => {
          const color = colors[i];
          const item = document.createElement('div');
          const key = document.createElement('span');
          key.className = 'legend-key';
          key.style.backgroundColor = color;

          const value = document.createElement('span');
          value.innerHTML = layer;
          item.appendChild(key);
          item.appendChild(value);
          legend.appendChild(item);
        });

        // Popup on hover
        map.on('mousemove', 'death-rate', (e) => {
          const county = e.features[0].properties.name;
          const deaths = e.features[0].properties.deathPer10k;

          map.getCanvas().style.cursor = 'pointer';

          new mapboxgl.Popup()
            .setLngLat(e.lngLat)
            .setHTML(`<strong>${county}</strong><br>Deaths per 10k: ${deaths}`)
            .addTo(map);
        });

        map.on('mouseleave', 'death-rate', () => {
          map.getCanvas().style.cursor = '';
        });
      });
    }

    geojsonFetch();
  </script>
</body>

</html>
